name: Verify application

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # npm test includes a real Chromium/ffmpeg render, so install these first.
      - name: Install browser and video test dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Validate application and rendering
        run: |
          npm run typecheck
          npm test
          npm run test:renderer
          npm run test:integration
          npm run test:smoke -- --workers=2
          npm run test:local-api
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
