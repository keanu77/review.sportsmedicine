name: Monthly data sync

# 03:17 UTC = 11:17 Asia/Taipei / 12:17 Asia/Tokyo, on day 1.
# Upstream rebuilds on day 28. Preserve the existing snapshot on any failure.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
concurrency:
  group: review-monthly-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch and validate before replacing data
        run: |
          cp public/data/reviews-index.json "$RUNNER_TEMP/previous-index.json"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 https://app.sportsmedicine.tw/data/reviews-index.json -o "$RUNNER_TEMP/next-index.json"
          node scripts/validate-index.mjs "$RUNNER_TEMP/next-index.json" "$RUNNER_TEMP/previous-index.json"
          if ! cmp -s "$RUNNER_TEMP/previous-index.json" "$RUNNER_TEMP/next-index.json"; then
            cp "$RUNNER_TEMP/next-index.json" public/data/reviews-index.json
            node scripts/build-new-items.mjs "$RUNNER_TEMP/previous-index.json" public/data/reviews-index.json public/data/new-items.json
            npm run feed
          fi
      - name: Enrich verified bibliographic metadata
        run: node --import tsx scripts/build-bibliography.ts
      - name: Verify application and data
        run: |
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:smoke -- --workers=2
      - name: Record monthly public data health
        run: node --import tsx scripts/monthly-report.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified data
        run: |
          git add public/data/reviews-index.json public/data/new-items.json public/data/bibliography.json public/feed.xml docs/maintenance/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(data): verified monthly literature and citation refresh'
            git push
          fi
      - name: Retain verification and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-data-verification
          path: |
            docs/maintenance/
            test-results/
          retention-days: 90
