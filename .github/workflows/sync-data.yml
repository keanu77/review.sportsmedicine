name: Monthly data sync

# 03:17 UTC = 11:17 Asia/Taipei / 12:17 Asia/Tokyo, on day 1.
# Upstream rebuilds on day 28. Preserve the existing snapshot on any failure.
on:
  workflow_dispatch:
    inputs:
      apply_updates:
        description: Publish verified data after all checks pass
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: read
concurrency:
  group: review-monthly-publish
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser and video test dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Fetch and validate before replacing data
        run: |
          cp public/data/reviews-index.json "$RUNNER_TEMP/previous-index.json"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 https://app.sportsmedicine.tw/data/reviews-index.json -o "$RUNNER_TEMP/next-index.json"
          node scripts/validate-index.mjs "$RUNNER_TEMP/next-index.json" "$RUNNER_TEMP/previous-index.json"
          if ! cmp -s "$RUNNER_TEMP/previous-index.json" "$RUNNER_TEMP/next-index.json"; then
            cp "$RUNNER_TEMP/next-index.json" public/data/reviews-index.json
            node scripts/build-new-items.mjs "$RUNNER_TEMP/previous-index.json" public/data/reviews-index.json public/data/new-items.json
            npm run feed
          fi
      - name: Enrich verified bibliographic metadata
        run: node --import tsx scripts/build-bibliography.ts
      - name: Verify application and data
        run: |
          npm test
          npm run build
          npm run test:smoke -- --workers=2
          npm audit --audit-level=moderate
      - name: Record monthly public data health
        run: node --import tsx scripts/monthly-report.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare data-only proposal
        run: node scripts/monthly-bundle.mjs pack sync "$RUNNER_TEMP/proposal/bundle.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-data-proposal
          path: ${{ runner.temp }}/proposal/bundle.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain verification and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-data-verification
          path: |
            docs/maintenance/
            test-results/
          retention-days: 90
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.apply_updates)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monthly-data-proposal
          path: ${{ runner.temp }}/proposal
      - name: Reject stale proposals
        env:
          EXPECTED_BASE: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
      # No npm installation or execution of code from update artifacts in this job.
      - name: Validate and commit allowlisted content
        run: node scripts/monthly-bundle.mjs apply sync "$RUNNER_TEMP/proposal/bundle.json"
      - name: Publish without persisting credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_KEY_1=core.hooksPath
          export GIT_CONFIG_VALUE_1=/dev/null
          git push origin HEAD:refs/heads/main
